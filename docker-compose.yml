services:

  mysql:
    image: mysql:8.4
    container_name: bloodconnect-mysql

    environment:
      MYSQL_ROOT_PASSWORD: raaga@73123436
      MYSQL_DATABASE: bloodconnect

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: bloodconnect-backend

    ports:
      - "8080:8080"

    depends_on:
      - mysql

volumes:
  mysql-data: