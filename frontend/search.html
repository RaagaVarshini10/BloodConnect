<!DOCTYPE html>
<html>

<head>
    <title>Find Blood Donor</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>🩸 BloodConnect</h1>
    <p>Connecting Blood Donors with Patients</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
    <a href="search.html">Search Donor</a>
</nav>

<div class="container">

    <h2>Search Blood Donor</h2>

    <p>Find available blood donors by blood group and city.</p>

    <form action="http://localhost:8080/search" method="POST">

        <label>Blood Group</label>

        <select name="bloodGroup">
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <label>City</label>

        <input
            type="text"
            name="city"
            placeholder="Enter City"
            required>

        <button type="submit">
            Search Donor
        </button>

    </form>

</div>

<footer>
    <p>© 2026 BloodConnect | Developed using Java, JDBC, MySQL, HTML & CSS</p>
</footer>

</body>

</html>
